image:
  name: docker:20.10.7
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:20.10.7-dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE: $CI_REGISTRY/terrace/tech/tfc-website_app

only:
  - prod
  - dev

before_script:
  - docker info
  - apk update
  - apk add docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
  - ./env-to-file.sh

stages:
- build
- test
- deploy

build:
  stage: build
  script:
    - export CI_stage=production
    - docker-compose build --pull
    - docker image ls
    - docker-compose push

test:
  stage: test
  script: 
    - docker-compose pull
    - docker-compose up -d
    - sleep 20
    - docker-compose exec -it app coverage run manage.py test website
    - docker-compose exec -it app coverage npm run test
    - docker-compose exec -it app coverage report

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  variables:
    APP_NAME: |
      case "$CI_COMMIT_BRANCH" in
        "prod") echo "$HEROKU_STAGING_STABLE" ;;
        "dev")  echo "$HEROKU_STAGING_UNSTABLE" ;;
      esac
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply -var="app_name=$APP_NAME" <<< $'yes'