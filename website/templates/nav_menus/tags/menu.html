{% load static tags_main %}
<div id="sidebar">
  <div class="header">
    <a href="https://twitter.com/terracefclub" target="_blank">
      <img src="{% static 'svg/twitter.svg' %}" alt="twitter" />
    </a>
    <a href="https://www.instagram.com/terracefclub/" target="_blank">
      <img src="{% static 'svg/instagram.svg' %}" alt="instagram" />
    </a>
    <a href="https://www.facebook.com/terracefclub/" target="_blank">
      <img src="{% static 'svg/facebook.svg' %}" alt="facebook" />
    </a>
    <button id="sidebar-x">
      <img src="{% static 'svg/x.svg' %}" alt="close" />
    </button>
  </div>
  <div class="container">
    {% for item in menu_items %}
      {{ item }}
    {% endfor %}
  </div>
</div>
