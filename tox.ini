[tox]
envlist =
    lint-py{39}
    django31-py{37,38,39}
    django30-py{37,38,39}
    django22-py{37,38,39}

[testenv]
deps =
    {[base]deps}[pytest]
    django31: {[django]3.1}
    django30: {[django]3.0}
    django22: {[django]2.2}
commands = pytest

[testenv:lint-py39]
deps = 
    flake8
commands = flake8 website/

[base]
deps =
    pytest
    pytest-django

[django]
3.1 = 
    Django>=3.1.0,<3.2.0
3.0 =
    Django>=3.0.0,<3.1.0
2.2 =
    Django>=2.2.0,<2.3.0

[pytest]
django_find_project = false
DJANGO_SETTINGS_MODULE = website.settings.dev
FAIL_INVALID_TEMPLATE_VARS = True
django_debug_mode = keep
addopts = --reuse-db
python_files = tests.py test_*.py *_tests.py *.test.py *.tests.py