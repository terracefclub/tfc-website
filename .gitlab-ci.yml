image:
  name: docker:stable
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY/terrace/tech/tfc-website/app

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_UNSTABLE
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_STABLE

before_script:
  - docker info
  - sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - sudo chmod +x /usr/local/bin/docker-compose
  - sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin

stages:
- build
- test
- deploy

build:
  stage: build
  script:
  - docker-compose build --build-arg mode="prod" -t $IMAGE_TAG .
  - docker-compose push $IMAGE_TAG

test:
  stage: test
  script: 
  - docker-compose pull $IMAGE_TAG
  - docker-compose up $IMAGE_TAG -d
  - sleep 20
  - docker-compose exec app ./scripts/test.sh

migrations:
  stage: test
  script:
    - docker-compose pull $IMAGE_TAG
    - docker-compose up $IMAGE_TAG -d
    - docker-compose run -T app python manage.py makemigrations

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  script:
  - login <<< $'yes\n$TF_TOKEN'
  - init
  - plan
  - apply -var="app_name=$APP_NAME" <<< $'yes'