{% load leaflet_tags static tags_main %}
<head>
  {% leaflet_js %}
  {% leaflet_css %}
  <script type="text/javascript">
    const mapCenter = [40.347, -74.654];
    const mapTileId = 'mapbox/dark-v10';
    const mapTileSize = 512;

    const initZoomLevel = 16;
    const maxZoomLevel = 17;
    const zoomOffset = -1;
    
    const markerMessage = "We are here :)";

    window.addEventListener("map:init", event => {

      // initialize leaflet map on event trigger from django-leaflet
      var map = event.detail.map;
      map.setView(mapCenter, initZoomLevel);

      // add marker to map at location of Terrace (mapCenter)
      var marker = L.marker(mapCenter).addTo(map);
      marker.bindPopup(markerMessage).openPopup();

      // import mapbox layer styling with environment api token and standard presets
      L.tileLayer('https://api.mapbox.com/styles/v1/{id}/tiles/{z}/{x}/{y}?access_token={accessToken}', {
        attribution: '© <a href="https://www.mapbox.com/about/maps/">Mapbox</a>',
        tileSize: mapTileSize,
        maxZoom: maxZoomLevel,
        zoomOffset: zoomOffset,
        id: mapTileId,
        accessToken: "{{ 'MAPBOX_ACCESS_TOKEN'|env }}"
      }).addTo(map);
    }, false);
  </script>
  <style>
    .leaflet-container {
      height: 75%;
      width: 15vw;
    }
    .leaflet-container-default {
      min-height: 50px !important;
    }
  </style>
</head>
<body>
  <footer>
    <img src="{% static 'img/tfc-badge.png' %}" alt="footer badge" />
    <p>
      Princeton Terrace Club<br/>
      62 Washington Rd.<br/>
      Princeton, NJ 08540<br/>
      <br/>
      phone: (609) 258-1380<br/>
      email: <a href="mailto: info@princetonterraceclub.org">info@princetonterraceclub.org</a>
    </p>
    {% leaflet_map "footer_map" %}
    <img src="{% static 'img/tfc-circle.png' %}" alt="footer circle" />
  </footer>
</body>
