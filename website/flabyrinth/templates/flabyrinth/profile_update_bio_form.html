{% load i18n static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    {{ form.media }}
    <link rel="stylesheet" type="text/css" href="{% static 'css/flabyrinth.css' %}">
  </head>
  <body>
    <form id="bio-form" action="{% url 'flabyrinth:profile_update' %}" method="POST" target="_parent">
      <div>
        <p>BIO</p>
        <div>
          <a id="bio-edit-cancel" href="{% url 'flabyrinth:profile' %}" target="_parent">CANCEL</a>
          <input id="bio-edit-submit" type="submit" value="SUBMIT">
        </div>
      </div>
      {% csrf_token %}
      {{ form }}
    </form>
  </body>
</html>
