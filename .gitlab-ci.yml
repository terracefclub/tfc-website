build:
  stage: build
  image: docker:latest
  services: [ "docker:dind" ]
    # - name: docker:dind
    #   entrypoint: ["env", "-u", "DOCKER_HOST"]
    #   command: ["dockerd-entrypoint.sh"]
  only: [ dev, prod ]    
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    HEROKU_PREFIX: registry.heroku.com/flabyrinth
    IMAGE_HEROKU: $HEROKU_PREFIX/web_app_server:$CI_COMMIT_BRANCH
    IMAGE_GITLAB: $CI_REGISTRY/$CI_PROJECT_PATH/web_app_server:$CI_COMMIT_BRANCH
  before_script:
    - echo $CI_WRITE_TOKEN $CI_REGISTRY $CI_WRITE_USER
    - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
    - docker info
    - echo $(eval echo $(cat .env.example | sed -r 's/([A-Z_]+)=/\1=$\1/g')) > .env
    - cat .env
  script:
    - docker build --pull -t $IMAGE_GITLAB --target production .
    - docker build --pull -t $IMAGE_GITLAB-test --target testing .
    - docker push $IMAGE_GITLAB
    - docker push $IMAGE_GITLAB-test

test:
  stage: test
  image: docker:latest
  services: [ "docker:dind" ]
  only: [ dev, prod ]
  before_script:
    - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
    - docker info
  script: 
    - docker pull $IMAGE_GITLAB-test
    - docker run -it $IMAGE_GITLAB-test

heroku:
  stage: deploy
  image: node:lts-alpine
  services: [ "docker:dind" ]
  only: [ dev ]
  before_script:
    - npm i -g heroku
    - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
    - docker info
    - echo $HEROKU_API_KEY | docker login registry.heroku.com --username=_ --password-stdin
    - docker info
  script:
    - docker pull $IMAGE_GITLAB postgres redis
    - docker tag $IMAGE_GITLAB $IMAGE_HEROKU
    - docker tag postgres $HEROKU_PREFIX/postgres
    - docker tag redis $HEROKU_PREFIX/redis
    - docker push $IMAGE_HEROKU $HEROKU_PREFIX/postgres $HEROKU_PREFIX/redis

stage:
  image: hashicorp/terraform:light
  stage: deploy
  only: [ dev ]
  before_script:
    - echo $(eval echo $(cat terraform.tfvars.example | sed -r 's/([A-Z_]+)=/\1=\"$\U\1\"/g')) > terraform.tfvars
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply <<< $'yes'

deploy:
  image: gcloud:latest
  stage: deploy
  only: [ prod ]
  script:
    - ls