{% load i18n %}

{% if not avatars %}
<div class="msg-box">
  <p>{% trans "You have no avatars to delete." %}</p>
</div>
{% else %}
<form method="POST" action="{% url 'avatar_delete' %}">
  {% csrf_token %}
  {% for field in delete_avatar_form %}
  {{ field.errors }}
  {{ field }}
  {% endfor %}
  <input type="submit" value="{% trans "Delete" %}" />
</form>
{% endif %}
