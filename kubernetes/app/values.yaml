replicaCount: 3

serviceAccount:
  create: true
  name: servicer

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  tls: []

enabled:
  database: true
  search: true


# Configurations for Elasticsearch
elasticsearch:
  labels:
    db: elasticsearch
  service:
    type: nodePort
    nodePort: 30001
  roles:
    master: "true"
    ingest: "true"
    data: "true"
    remote_cluster_client: "true"
    ml: "true"
  replicas: 3
  secretMounts:
  - name: elastic-secret
    secretName: secrets-base
    path: /usr/share/elasticsearch/config/certs
    defaultMode: 0755 #???
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  ingress:
    enabled: true
    hosts: []
    tls: []


# Configurations for PostgreSQL
postgresql:
  global:
    postgresql:
      postgresqlDatabase: web
      postgresqlUsername: admin
      existingSecret: secrets-base
      servicePort: 5432
  replication:
    enabled: true
    readReplicas: 3
    numSynchronousReplicas: 2
  service:
    type: LoadBalancer
    nodePort: 30000
  persistence:
    selector:
      db: postgres

# Configurations for Redis
redis:
  existingSecret: secrets-base
  existingSecretPasswordKey: redis-password
  tls:
    enabled: true
    authClients: true
    certificatesSecret: secrets-base
    certFilename: ""
    certKeyFilename: ""
    certCAFilename: ""
  serviceAccount:
    create: true
    name: ""