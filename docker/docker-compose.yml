version: '3.8'
services:
  db:
    container_name: postgres
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: web
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    container_name: redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
  app:
    container_name: app
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      - ..:/code
    links:
      - db:db
      - redis:redis
    depends_on:
      - db
      - redis
    command: /bin/sh -c "while sleep 1000; do :; done"
volumes:
  pgdata: