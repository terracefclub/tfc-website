[metadata]
name = terrace-flabyrinth-club
version = 0.1.0
description = A Django & Wagtail project for handling blogging, social media, and more.
long_description = file: README.md
url = https://www.princetonterraceclub.org/
author = Tristan Schrader
author_email = schrader.tristan@gmail.com
license = BSL-1.0
classifiers = 
    Framework :: Django
    CMS :: Wagtail
    License :: OSI Approved :: BSL
    Operating System :: OS Independent
    Programming Language :: Python :: 3.9
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = true
packages = find:
python_requires = >=3.7
install_requires =
    Django
    django-address
    django-allauth
    django-apscheduler
    django-avatar
    django-dotenv
    django-clearcache
    django-debug-toolbar
    django-filebrowser
    django-leaflet
    django-phonenumber-field[phonenumberslite]
    django-redis
    django-taggit
    django-taggit-autosuggest
    django-tinymce
    docutils
    elasticsearch
    fontawesome-free
    google-api-python-client
    google-auth-httplib2
    google-auth-oauthlib
    hiredis
    Pillow
    psycopg2
    wagtail
    wagtailmedia
    wagtail-nav-menus
    wagtail-experiments
    whitenoise

[bumpversion]
current_version = 0.1.0
commit = True
tag = True

[bumpversion:file:setup.py]

[flake8]
max-line-length = 80
exclude = 
    .git,
    __pycache__,
    docs/,
    */migrations/*,
    node_modules,
    */settings/*
select = C,E,F,W,DJ,DJ10,DJ11