<a 
  {% if arrow %}
  class="sidebar-nav"
  {% else %}
  href="{% include 'nav_menus/get_url.html' with link=self %}"
  {% endif %}
  {% if self.open_in_new_tab %}
  target="_blank"
  {% endif %}
>
  <div class="sidebar-link-container">
    <div class="link-box">
        <p class="link-box-title">
            {% if self.override_title %}
            {{ self.override_title }}
            {% elif self.page.title %}
            {{ self.page.title }}
            {% else %}
            {{ self.title }}
            {% endif %}
        </p>
        {% if arrow %}
        <span class="arrow-r nav-drop"></span>
        {% endif %}
    </div>
    <div class="line"></div>
  </div>
</a>
