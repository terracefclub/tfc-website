[tool.black]
line-length = 80

[tool.mypy]
python_version = "3.9"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "settings.dev"

[[tool.mypy.overrides]]
module = [
    "docx",
    "wagtail.*",
    "modelcluster.*",
    "taggit.*",
    "wagtailmedia.*",
    "apscheduler.*",
    "django_filters",
    "django_apscheduler.*",
    "storages.*",
    "debug_toolbar",
    "wagtail_nav_menus.*",
    "google.*",
    "factory.*",
    "wagtail_factories.*"
]
ignore_missing_imports = true