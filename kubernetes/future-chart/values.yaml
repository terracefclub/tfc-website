replicaCount: 3

image:
  repository: registry.gitlab.com/terrace/tech/tfc-website/app
  pullPolicy: Always
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: servicer

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  nodePort: 30000

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

enabled:
  database: true
  search: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    memory: 256Mi
    cpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
affinity: {}
tolerations: []



# Configurations for PostgreSQL
postgresql:
  global:
    postgresql:
      postgresqlDatabase: web
      postgresqlUsername: admin
      existingSecret: secrets-base
      servicePort: 5432
  replication:
    enabled: true
    readReplicas: 3
    numSynchronousReplicas: 2
  service:
    type: LoadBalancer
    nodePort: 30000
  persistence:
    selector:
      db: postgres

# Configurations for Redis
redis:
  existingSecret: secrets-base
  existingSecretPasswordKey: redis-password
  tls:
    enabled: true
    authClients: true
    certificatesSecret: secrets-base
    certFilename: ""
    certKeyFilename: ""
    certCAFilename: ""
  serviceAccount:
    create: true
    name: ""