image:
  name: docker:stable
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  IMAGE: $CI_REGISTRY/terrace/tech/tfc-website_app

# cache:
#   key: pip-global-cache
#   paths:
#     - $CI_PROJECT_DIR/.cache/pip

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_UNSTABLE
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_STABLE

before_script:
  - docker info
  - apk update
  - apk add docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin

stages:
- build
- test
- deploy

build:
  stage: build
  script:
    - docker-compose build --pull --build-arg BUILD_PRODUCTION=1
    - docker image ls
    - docker-compose push $IMAGE

test:
  stage: test
  script: 
    - docker-compose pull $IMAGE
    - docker-compose up $IMAGE -d
    - sleep 20
    - docker-compose exec -it app coverage run manage.py test website
    - docker-compose exec -it app coverage npm run test
    - docker-compose exec -it app coverage report

migrations:
  stage: test
  script:
    - docker-compose pull $IMAGE
    - docker-compose up $IMAGE -d
    - docker-compose run -T app python manage.py makemigrations

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply -var="app_name=$APP_NAME" <<< $'yes'