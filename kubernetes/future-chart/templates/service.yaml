apiVersion: v1
kind: Service
metadata:
  name: {{ include "future-chart.fullname" . }}-service
  labels:
    {{- include "future-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "future-chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http1
      protocol: TCP
      name: http1
