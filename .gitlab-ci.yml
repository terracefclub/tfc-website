image:
  name: docker/compose:latest
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]

variables:
  DOCKER_HOST: tcp://docker:2378/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY/terrace/tech/tfc-website/app

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
      variables:
        PROD_ENV: "unstable"
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always
      variables:
        PROD_ENV: "stable"

before_script:
- echo "$CI_WRITE_TOKEN" | docker login -u "$CI_WRITE_USER" --password-stdin $CI_REGISTRY

stages:
- build
- test
- deploy

build:
  stage: build
  script:
  - docker-compose build --build-arg mode="prod" -t $IMAGE_TAG .
  - docker-compose push $IMAGE_TAG

test:
  stage: test
  script: 
  - docker-compose pull $IMAGE_TAG
  - docker-compose up $IMAGE_TAG -d
  - sleep 20
  - docker-compose exec app ./scripts/test.sh

migrations:
  stage: test
  script:
    - docker-compose pull $IMAGE_TAG
    - docker-compose up $IMAGE_TAG -d
    - docker-compose run -T app python manage.py makemigrations

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  script:
  - login <<< $'yes\n$TF_TOKEN'
  - init
  - plan
  - apply <<< $'yes'