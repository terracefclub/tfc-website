image:
  name: docker:20.10.7
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:20.10.7-dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE: $CI_REGISTRY/terrace/tech/tfc-website/terrace_app:$CI_COMMIT_BRANCH

only:
  - prod
  - dev

before_script:
  - docker info
  - apk update
  - apk add docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
  - echo $(eval echo $(cat .env.example | sed -r 's/([A-Z_]+)=/\1=$\1/g')) > .env

stages:
- build
- test
- deploy

build:
  stage: build
  variables:
    CI_STAGE: production
  script:
    - docker-compose build --pull -t $IMAGE .
    - CI_STAGE=testing docker-compose build --pull -t $IMAGE-test
    - docker-compose push $IMAGE
    - docker-compose push $IMAGE-test

test:
  stage: test
  variables:
    CI_STAGE: testing
  script: 
    - docker-compose pull $IMAGE-test
    - docker-compose up $IMAGE-test -d
    - docker-compose exec -it app coverage run manage.py test website
    - docker-compose exec -it app coverage npm run test
    - docker-compose exec -it app coverage report

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  variables:
    CI_STAGE: production
    APP_NAME: |
      case "$CI_COMMIT_BRANCH" in
        "prod") echo "$HEROKU_STAGING_STABLE" ;;
        "dev")  echo "$HEROKU_STAGING_UNSTABLE" ;;
      esac
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply -var="app_name=$APP_NAME" <<< $'yes'