{% load static wagtailcore_tags account avatar_tags %}

<header>
  <button id="sidebar-trigger"><i class="fas fa-bars fa-5x"></i></button>
  <a id="logo" href="/" style="background-image: url({% static 'svg/logo.svg' %})"></a>
  <div class="search">
    <i class="fas fa-search"></i>
    <input type="text" id="search" />
  </div>
  <div class="donate">
    <a class="button" href="{% slugurl 'donate' %}">DONATE</a>
    <img class="sparkle1" src="{% static 'svg/sparkle.svg' %}" alt="sparkle" />
    <img class="sparkle2" src="{% static 'svg/sparkle.svg' %}" alt="sparkle" />
  </div>
  {% if request.user.is_authenticated %}
  <div id="user-header">
    <p>Hello {% user_display request.user %}!</p>
    <a id="avatar" href="{% url 'flabyrinth:profile' %}">
      {% avatar request.user 64 %}
    </a>
    <a class="sign-up" href="{% url 'account_logout' %}">LOGOUT</a>
  </div>
  {% else %}
  <a class="sign-up" href="{% url 'account_login' %}">LOGIN</a>
  {% endif %}
</header>
