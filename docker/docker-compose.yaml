version: '2'
services:
  db:
    environment:
      POSTGRES_DB: web
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    restart: always
    image: postgres:13-alpine
    ports:
      - "5432:5432"
  redis:
    restart: always
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    network_mode: service:db
  elasticsearch:
    image: elasticsearch:7.10.1
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    network_mode: service:db
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    container_name: app-ci-image
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - media:/code/website/media
    links:
      - db:db
      - redis:redis
      - elasticsearch:elasticsearch
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - elasticsearch
    network_mode: service:db
volumes:
  media:
