apiVersion: v2
name: future-chart
description: A Helm chart for deploying TFC website infrastructure
type: application

# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0
appVersion: 1.0.0

dependencies:
  - name: postgresql
    version: 10.5.0
    condition: enabled.database
    repository: https://charts.bitnami.com/bitnami
  - name: redis
    version: 14.6.2
    condition: enabled.cache
    repository: https://charts.bitnami.com/bitnami
  - name: nginx-ingress-controller
    version: 7.6.11
    condition: enabled.ingress
    repository: https://charts.bitnami.com/bitnami