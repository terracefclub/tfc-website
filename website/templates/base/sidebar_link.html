<a 
  href="{% include 'nav_menus/get_url.html' with link=self %}"
  {% if self.open_in_new_tab %}
  target="_blank"
  {% endif %}
>
  <div class="flex flex-col items-flex-start pl-4 gap-4">
    <p class="" style="color: #C4C4C4">
      {% if self.override_title %}
          {{ self.override_title }}
        {% elif self.page.title %}
          {{ self.page.title }}
        {% else %}
          {{ self.link }}
        {% endif %}
    </p>
    <div class="h-0 w-10/12" style="border: 5px solid #C4C4C4"></div>
  </div>
</a>
