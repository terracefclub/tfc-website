{% extends 'flabyrinth/base.html' %}

{% block content %}
<div class="profile-list">
  {% for mentor in mentors %}
  <div class="profile">
    {{ mentor.profile.user.username }}
  </div>
  {% endfor %}
</div>
<div class="profile-list">
  {% for mentee in mentees %}
  <div class="profile">
    {{ mentee.profile.user.username }}
  </div>
  {% endfor %}
</div>
{% endblock content %}
