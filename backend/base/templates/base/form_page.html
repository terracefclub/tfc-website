{% extends 'base.html' %}
{% load wagtailcore_tags %}

{% block body_class %}template-formpage forms{% endblock body_class %}

{% block content %}
<div id="form-container">
  <h1>{{ page.title }}</h1>
  {% if form %}
    <form action="{% pageurl page %}" method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit">
    </form>
  {% endif %}

{% endblock %}
