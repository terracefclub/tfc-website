replicaCount: 3

image:
  repository: registry.gitlab.com/terrace/tech/tfc-website/app
  pullPolicy: Always
  tag: ""

serviceAccount:
  create: true
  annotations: {}
  name: servicer

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
  nodePort: 30000

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: future-chart.local
      paths: []
  tls: []
  #  - secretName: secret-tls
  #    hosts:
  #      - future-chart.local

enabled:
  database: true
  cache: true
  ingress: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    memory: 256Mi
    cpu: "1"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}
affinity: {}
tolerations: []



# Configurations for PostgreSQL
postgresql:
  postgresqlDatabase: web
  postgresqlUsername: admin
  existingSecret: secret-postgresql
  extraEnvVarsCM: config-postgresql
  replication:
    enabled: true
    readReplicas: 3
    numSynchronousReplicas: 2
  service:
    type: LoadBalancer
    nodePort: 30000
  persistence:
    selector:
      db: postgres

# Configurations for Redis
redis:
  existingSecret: secrets-base
  existingSecretPasswordKey: redis-password
  serviceAccount:
    create: true
    name: servicer