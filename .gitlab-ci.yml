#     command: ["dockerd-entrypoint.sh"]

image: docker:latest
services: [docker:dind]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  IMAGE: $CI_REGISTRY/terrace/tech/tfc-website_app

# cache:
#   key: pip-global-cache
#   paths:
#     - $CI_PROJECT_DIR/.cache/pip

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_UNSTABLE
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_STABLE

before_script:
  - docker info
  - apk update
  - apk add docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
  - echo SECRET_KEY=$SECRET_KEY >> .env
  - echo MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN >> .env
  - echo GOOGLE_SERVICE_ACCT_FILE=$GOOGLE_SERVICE_ACCT_FILE >> .env
  - echo GOOGLE_API_KEY=$GOOGLE_API_KEY >> .env
  - echo TINYCLOUD_API_KEY=$TINYCLOUD_API_KEY >> .env

stages:
- build
- test
- deploy

build:
  stage: build
  script:
    - export CI_stage=production
    - docker-compose build --pull
    - docker image ls
    - docker-compose push

test:
  stage: test
  script: 
    - docker-compose pull
    - docker-compose up -d
    - sleep 20
    - docker-compose exec -it app coverage run manage.py test website
    - docker-compose exec -it app coverage npm run test
    - docker-compose exec -it app coverage report

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply -var="app_name=$APP_NAME" <<< $'yes'