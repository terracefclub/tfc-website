image:
  name: docker:stable
  entrypoint: ["/bin/sh", "-c"]

services:
  - name: docker:dind
    entrypoint: ["env", "-u", "DOCKER_HOST"]
    command: ["dockerd-entrypoint.sh"]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  IMAGE_TAG: $CI_REGISTRY/terrace/tech/tfc-website/app

cache:
  paths:
    - .cache/pip

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_UNSTABLE
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: always
      variables:
        APP_NAME: $HEROKU_STAGING_STABLE

before_script:
  - docker info
  - apk update
  - apk add py-pip python3-dev libffi-dev musl-dev openssl-dev gcc libc-dev rust cargo make
  - pip --version
  - pip install --upgrade pip
  - pip --version
  - pip install docker-compose
  - docker-compose --version
  - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin

stages:
- build
- test
- deploy

build:
  stage: build
  script:
  - docker-compose build --pull --build-arg mode="prod"
  - docker image ls
  - docker-compose push

test:
  stage: test
  script: 
  - docker-compose pull $IMAGE_TAG
  - docker-compose up $IMAGE_TAG -d
  - sleep 20
  - docker-compose exec app ./scripts/test.sh

migrations:
  stage: test
  script:
    - docker-compose pull $IMAGE_TAG
    - docker-compose up $IMAGE_TAG -d
    - docker-compose run -T app python manage.py makemigrations

deploy:
  image: hashicorp/terraform:light
  stage: deploy
  script:
  - login <<< $'yes\n$TF_TOKEN'
  - init
  - plan
  - apply -var="app_name=$APP_NAME" <<< $'yes'