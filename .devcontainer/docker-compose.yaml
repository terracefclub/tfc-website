version: '3.7'
services:
  postgres:
    container_name: postgres
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - 5432
    volumes: 
      - pgdata:/var/lib/postgresql/data
  redis:
    container_name: redis
    image: redis:6.2-alpine
    restart: unless-stopped
    ports:
      - 6379
  server:
    container_name: server
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
      target: dev
      args:
        username: ${UUID}
        groupname: ${GUID}
        pipargs: ${PIPARGS}
        STAGE: dev
    entrypoint: /bin/bash
    env_file: 
      - ../config/env/postgres.local.env
      - ../config/env/local-ci.env
      - ../config/env/.env
    stdin_open: true
    volumes:
      - ../:${BASEDIR}
      - dev-home:/home/${UUID}
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
  dev-home: