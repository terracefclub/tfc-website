heroku:
  stage: deploy
  image: docker
  services: [ "docker:dind" ]
  only: [ dev ]
  before_script:
    - apt-get install --yes curl
    - curl -fsSL https://deb.nodesource.com/setup_14.x | bash -
    - apt-get install --yes nodejs
    - npm i -g heroku
    - echo $CI_WRITE_TOKEN | docker login $CI_REGISTRY --username $CI_WRITE_USER --password-stdin
    - docker info
    - echo $HEROKU_API_KEY | docker login registry.heroku.com --username=_ --password-stdin
    - docker info
  script:
    - docker pull $IMAGE_GITLAB postgres redis
    - docker tag $IMAGE_GITLAB $IMAGE_HEROKU
    - docker tag postgres $HEROKU_PREFIX/postgres
    - docker tag redis $HEROKU_PREFIX/redis
    - docker push $IMAGE_HEROKU $HEROKU_PREFIX/postgres $HEROKU_PREFIX/redis

stage:
  image: hashicorp/terraform:light
  stage: deploy
  only: [ dev ]
  before_script:
    - echo $(eval echo $(cat terraform.tfvars.example | sed -r 's/([A-Z_]+)=/\1=\"$\U\1\"/g')) > terraform.tfvars
  script:
    - login <<< $'yes\n$TF_TOKEN'
    - init
    - plan
    - apply <<< $'yes'

deploy:
  image: gcloud:latest
  stage: deploy
  only: [ prod ]
  script:
    - ls