{# List of social icons  #}
{% for link in links %}
{% with link.0 as social %}
<a id="{{ social }}" class="detail-social" href="{{ link.1 }}" target="_blank">

  {# ZOOM has no icon in Font Awesome, so specific styling is needed #}
  <i class="icon
    {% if social == 'zoom' %}fas fa-video
    {% elif social == 'instagram' %}fab fa-instagram fa-2x
    {% else %}fab fa-{{ social }}-square fa-2x
    {% endif %}"
  ></i>
</a>
{% endwith %}
{% endfor %}
