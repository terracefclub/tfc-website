version: '3.7'
services:
  db:
    container_name: postgres
    image: postgres:13-alpine
    restart: always
    environment:
      POSTGRES_DB: web
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    container_name: redis
    image: redis:6.2-alpine
    restart: always
    ports:
      - "6379:6379"
  app:
    container_name: app
    build:
      context: .
      dockerfile: ./Dockerfile
      target: ${CI_STAGE}
    env_file: .env
    volumes:
      - ./:/usr/src/womb
    depends_on:
      - db
      - redis
volumes:
  pgdata: